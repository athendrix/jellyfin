name: Fork container image

# Builds the server from this repository and the web client from the jellyfin-web fork into one image,
# published as ghcr.io/<owner>/jellyfin.
#
# Runs on every push to master, when the web client fork asks for it (repository_dispatch "web-updated", see
# that repository's fork-trigger-container workflow), and on demand.

on:
  push:
    branches:
      - master
  repository_dispatch:
    types:
      - web-updated
  workflow_dispatch:
    inputs:
      web_ref:
        description: Branch, tag or commit of the web client to build
        required: false
        default: master

concurrency:
  group: fork-container
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  WEB_REPOSITORY: ${{ github.repository_owner }}/jellyfin-web

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the server
        uses: actions/checkout@v4

      - name: Check out the web client
        uses: actions/checkout@v4
        with:
          repository: ${{ env.WEB_REPOSITORY }}
          ref: ${{ github.event.inputs.web_ref || github.event.client_payload.ref || 'master' }}
          path: jellyfin-web-src

      - name: Compute image name and tags
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/jellyfin"
          server_sha="$(git rev-parse --short=12 HEAD)"
          web_sha="$(git -C jellyfin-web-src rev-parse --short=12 HEAD)"
          {
            echo "image=$image"
            echo "tags=$image:latest,$image:server-$server_sha-web-$web_sha"
            echo "server_sha=$server_sha"
            echo "web_sha=$web_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/fork/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Jellyfin server ${{ steps.meta.outputs.server_sha }} with web client ${{ steps.meta.outputs.web_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Published \`${{ steps.meta.outputs.image }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "and \`${{ steps.meta.outputs.image }}:server-${{ steps.meta.outputs.server_sha }}-web-${{ steps.meta.outputs.web_sha }}\`." >> "$GITHUB_STEP_SUMMARY"
